<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Undercounter Bar &amp; Glasswasher">
  <defs>
    <!-- Studio Photography Neutral Gradient Background -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Top Cap Stainless Gradient -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Chrome & Polished Steel Reflection -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Metal Chassis -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Precision Control Knob Gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Amber Brand Highlight -->
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Realistic Soft Drop Shadow Filter -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Pure White Studio Background (#FFFFFF) matching real catalog photography -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Product Vector Rendering -->
  
      <ellipse cx="200" cy="245" rx="115" ry="12" fill="#0F172A" opacity="0.12"/>
      <rect x="115" y="60" width="170" height="175" rx="4" fill="url(#steelGrad)" stroke="#64748B" stroke-width="1.5"/>
      
      <!-- Top Digital Fascia -->
      <rect x="122" y="68" width="156" height="25" rx="2" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <circle cx="138" cy="80.5" r="5" fill="#10B981"/>
      <rect x="155" y="73" width="50" height="15" rx="2" fill="#1E293B"/>
      <text x="180" y="84" fill="#38BDF8" font-size="8" font-weight="700" text-anchor="middle" font-family="monospace">120s</text>
      <circle cx="260" cy="80.5" r="6" fill="#D97706"/>

      <!-- Front Drop-Down Door -->
      <rect x="122" y="98" width="156" height="130" rx="3" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Recessed Handle -->
      <rect x="135" y="105" width="130" height="10" rx="3" fill="#1E293B"/>
      
      <!-- Center Emblem / Clean Glassware Graphic -->
      <circle cx="200" cy="165" r="24" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
      <path d="M192,152 L208,152 L203,170 L203,180 L197,180 L197,170 Z" fill="none" stroke="#38BDF8" stroke-width="1.5"/>
      <!-- Legs -->
      <rect x="125" y="235" width="14" height="10" rx="2" fill="url(#steelTop)"/>
      <rect x="261" y="235" width="14" height="10" rx="2" fill="url(#steelTop)"/>
    
</svg>