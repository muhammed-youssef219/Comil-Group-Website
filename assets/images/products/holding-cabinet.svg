<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Mobile Heated Banquet Cabinet">
  <defs>
    <!-- Studio Photography Neutral Gradient Background -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Top Cap Stainless Gradient -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Chrome & Polished Steel Reflection -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Metal Chassis -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Precision Control Knob Gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Amber Brand Highlight -->
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Realistic Soft Drop Shadow Filter -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Pure White Studio Background (#FFFFFF) matching real catalog photography -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Product Vector Rendering -->
  
      <ellipse cx="200" cy="250" rx="115" ry="12" fill="#0F172A" opacity="0.12"/>
      <!-- Insulated Cabinet Body -->
      <rect x="115" y="45" width="170" height="185" rx="4" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Full Perimeter Rubber Bumper -->
      <rect x="110" y="222" width="180" height="12" rx="3" fill="#0F172A"/>

      <!-- Insulated Flush Door -->
      <rect x="125" y="55" width="150" height="162" rx="3" fill="url(#steelGrad)" stroke="#64748B" stroke-width="1.2"/>
      <!-- Top Analog Thermometer Dial -->
      <circle cx="200" cy="78" r="14" fill="#0F172A" stroke="#D97706" stroke-width="1.5"/>
      <text x="200" y="82" fill="#F59E0B" font-size="7" font-weight="700" text-anchor="middle" font-family="monospace">75°C</text>

      <!-- Heavy Transport Grab Handles on Side -->
      <rect x="108" y="100" width="6" height="50" rx="3" fill="#334155"/>
      <rect x="286" y="100" width="6" height="50" rx="3" fill="#334155"/>
      <!-- Center Door Compression Latch -->
      <rect x="258" y="125" width="10" height="35" rx="3" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>

      <!-- 4 Heavy-Duty Swivel Castor Wheels -->
      <circle cx="135" cy="244" r="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
      <circle cx="265" cy="244" r="8" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    
</svg>