<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Multi-Function Combi Steamer Oven">
  <defs>
    <!-- Studio Photography Neutral Gradient Background -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Top Cap Stainless Gradient -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Chrome & Polished Steel Reflection -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Metal Chassis -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Precision Control Knob Gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Amber Brand Highlight -->
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Realistic Soft Drop Shadow Filter -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Pure White Studio Background (#FFFFFF) matching real catalog photography -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Product Vector Rendering -->
  
      <ellipse cx="200" cy="248" rx="130" ry="12" fill="#0F172A" opacity="0.12"/>
      <!-- Body -->
      <rect x="95" y="45" width="210" height="195" rx="5" fill="url(#steelGrad)" stroke="#64748B" stroke-width="1.5"/>
      <!-- Digital Touch Panel (Right Column) -->
      <rect x="245" y="55" width="50" height="175" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <!-- Digital Display Screen -->
      <rect x="250" y="65" width="40" height="50" rx="2" fill="#0284C7" opacity="0.9"/>
      <text x="270" y="85" fill="#FFFFFF" font-size="10" font-weight="700" text-anchor="middle" font-family="monospace">180°C</text>
      <text x="270" y="100" fill="#E0F2FE" font-size="7" font-weight="600" text-anchor="middle" font-family="sans-serif">STEAM 80%</text>
      <!-- Touch Buttons -->
      <circle cx="270" cy="130" r="8" fill="#1E293B" stroke="#D97706" stroke-width="1.5"/>
      <circle cx="270" cy="155" r="8" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
      <circle cx="270" cy="180" r="8" fill="#1E293B" stroke="#94A3B8" stroke-width="1"/>
      <!-- Master Dial Knob -->
      <circle cx="270" cy="208" r="10" fill="url(#knobGrad)" stroke="#E2E8F0" stroke-width="1.5"/>

      <!-- Large Inspection Glass Door -->
      <rect x="105" y="55" width="132" height="175" rx="4" fill="#0F172A" stroke="#475569" stroke-width="1.5"/>
      <rect x="115" y="65" width="112" height="155" rx="2" fill="#1E293B"/>
      <!-- Illuminated Cooking Chamber & Tray Runners -->
      <g stroke="#64748B" stroke-width="1.5">
        <line x1="122" y1="80" x2="220" y2="80"/>
        <line x1="122" y1="95" x2="220" y2="95"/>
        <line x1="122" y1="110" x2="220" y2="110"/>
        <line x1="122" y1="125" x2="220" y2="125"/>
        <line x1="122" y1="140" x2="220" y2="140"/>
        <line x1="122" y1="155" x2="220" y2="155"/>
        <line x1="122" y1="170" x2="220" y2="170"/>
        <line x1="122" y1="185" x2="220" y2="185"/>
        <line x1="122" y1="200" x2="220" y2="200"/>
      </g>
      <!-- Halogen Chamber Glow -->
      <ellipse cx="170" cy="140" rx="35" ry="50" fill="#F59E0B" opacity="0.15"/>
      <!-- Heavy Vertical Handle -->
      <rect x="228" y="90" width="6" height="85" rx="3" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>
      <!-- Stainless Legs -->
      <rect x="110" y="240" width="16" height="12" rx="2" fill="url(#steelTop)"/>
      <rect x="275" y="240" width="16" height="12" rx="2" fill="url(#steelTop)"/>
    
</svg>