<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Upright Storage Chiller (1400L)">
  <defs>
    <!-- Studio Photography Neutral Gradient Background -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Top Cap Stainless Gradient -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Chrome & Polished Steel Reflection -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Metal Chassis -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Precision Control Knob Gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Amber Brand Highlight -->
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Realistic Soft Drop Shadow Filter -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Pure White Studio Background (#FFFFFF) matching real catalog photography -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Product Vector Rendering -->
  
      <ellipse cx="200" cy="252" rx="125" ry="12" fill="#0F172A" opacity="0.12"/>
      <!-- Main Cabinet Frame -->
      <rect x="100" y="35" width="200" height="212" rx="4" fill="url(#steelGrad)" stroke="#64748B" stroke-width="1.5"/>
      <!-- Top Compressor Canopy -->
      <rect x="105" y="40" width="190" height="30" rx="2" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <!-- Ventilation Grille -->
      <g stroke="#64748B" stroke-width="1.5">
        <line x1="115" y1="48" x2="230" y2="48"/>
        <line x1="115" y1="54" x2="230" y2="54"/>
        <line x1="115" y1="60" x2="230" y2="60"/>
      </g>
      <!-- Digital Controller Display -->
      <rect x="245" y="46" width="40" height="18" rx="2" fill="#0F172A" stroke="#0284C7" stroke-width="1"/>
      <text x="265" y="59" fill="#38BDF8" font-size="9" font-weight="700" text-anchor="middle" font-family="monospace">+2.5°C</text>

      <!-- Left Solid Door -->
      <rect x="105" y="75" width="92" height="165" rx="3" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Right Solid Door -->
      <rect x="203" y="75" width="92" height="165" rx="3" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Heavy Full-Length Extruded Handles -->
      <rect x="190" y="90" width="5" height="120" rx="2.5" fill="#334155" stroke="#94A3B8" stroke-width="1"/>
      <rect x="205" y="90" width="5" height="120" rx="2.5" fill="#334155" stroke="#94A3B8" stroke-width="1"/>

      <!-- Door Key Locks -->
      <circle cx="192" cy="82" r="2.5" fill="#94A3B8"/>
      <circle cx="207" cy="82" r="2.5" fill="#94A3B8"/>
      <!-- Stainless Legs -->
      <rect x="110" y="247" width="16" height="10" rx="2" fill="url(#steelTop)"/>
      <rect x="274" y="247" width="16" height="10" rx="2" fill="url(#steelTop)"/>
    
</svg>