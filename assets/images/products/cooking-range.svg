<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="6-Burner Commercial Gas Range">
  <defs>
    <!-- Studio Photography Neutral Gradient Background -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Top Cap Stainless Gradient -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Chrome & Polished Steel Reflection -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Metal Chassis -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Precision Control Knob Gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Amber Brand Highlight -->
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Realistic Soft Drop Shadow Filter -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Pure White Studio Background (#FFFFFF) matching real catalog photography -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Product Vector Rendering -->
  
      <!-- Range Base Shadow -->
      <ellipse cx="200" cy="245" rx="140" ry="14" fill="#0F172A" opacity="0.12"/>
      
      <!-- Range Main Body (Brushed Stainless Steel) -->
      <rect x="80" y="70" width="240" height="165" rx="4" fill="url(#steelGrad)" stroke="#64748B" stroke-width="1.5"/>
      <rect x="80" y="70" width="240" height="25" rx="3" fill="url(#steelTop)" stroke="#475569" stroke-width="1.5"/>

      <!-- Cooktop Cast Iron Grates (6 Burners: 2 rows of 3) -->
      <g stroke="#1E293B" stroke-width="3" fill="#0F172A">
        <!-- Back Row -->
        <rect x="90" y="42" width="65" height="24" rx="2" fill="#1E293B"/>
        <rect x="168" y="42" width="64" height="24" rx="2" fill="#1E293B"/>
        <rect x="245" y="42" width="65" height="24" rx="2" fill="#1E293B"/>
        <!-- Burner Rings -->
        <circle cx="122" cy="54" r="7" fill="#0F172A" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="200" cy="54" r="7" fill="#0F172A" stroke="#D97706" stroke-width="1.5"/>
        <circle cx="278" cy="54" r="7" fill="#0F172A" stroke="#D97706" stroke-width="1.5"/>
      </g>

      <!-- Control Panel Strip -->
      <rect x="90" y="75" width="220" height="22" rx="2" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <!-- Knobs -->
      <circle cx="110" cy="86" r="6" fill="url(#knobGrad)" stroke="#94A3B8" stroke-width="1"/>
      <circle cx="138" cy="86" r="6" fill="url(#knobGrad)" stroke="#94A3B8" stroke-width="1"/>
      <circle cx="166" cy="86" r="6" fill="url(#knobGrad)" stroke="#94A3B8" stroke-width="1"/>
      <circle cx="234" cy="86" r="6" fill="url(#knobGrad)" stroke="#94A3B8" stroke-width="1"/>
      <circle cx="262" cy="86" r="6" fill="url(#knobGrad)" stroke="#94A3B8" stroke-width="1"/>
      <circle cx="290" cy="86" r="6" fill="url(#knobGrad)" stroke="#94A3B8" stroke-width="1"/>
      <!-- Thermostat Dial (Center Amber) -->
      <circle cx="200" cy="86" r="7" fill="#D97706" stroke="#FEF3C7" stroke-width="1.5"/>

      <!-- Lower Oven Section -->
      <rect x="90" y="105" width="220" height="120" rx="4" fill="url(#metalDark)" stroke="#475569" stroke-width="1.5"/>
      <!-- Oven Handle -->
      <rect x="110" y="112" width="180" height="7" rx="3.5" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>
      <circle cx="115" cy="115.5" r="3" fill="#475569"/>
      <circle cx="285" cy="115.5" r="3" fill="#475569"/>
      <!-- Oven Inspection Glass -->
      <rect x="115" y="128" width="170" height="85" rx="3" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
      <rect x="125" y="138" width="150" height="65" rx="2" fill="#1E293B" opacity="0.8"/>
      <!-- Interior Baking Grid -->
      <line x1="130" y1="160" x2="270" y2="160" stroke="#475569" stroke-width="1.5"/>
      <line x1="130" y1="180" x2="270" y2="180" stroke="#475569" stroke-width="1.5"/>

      <!-- Heavy Duty Stainless Legs -->
      <rect x="95" y="235" width="16" height="14" rx="2" fill="url(#steelTop)" stroke="#475569"/>
      <rect x="289" y="235" width="16" height="14" rx="2" fill="url(#steelTop)" stroke="#475569"/>
    
</svg>