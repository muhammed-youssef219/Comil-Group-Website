<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Gravity Meat &amp; Deli Slicer">
  <defs>
    <!-- Studio Photography Neutral Gradient Background -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Top Cap Stainless Gradient -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Chrome & Polished Steel Reflection -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Metal Chassis -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Precision Control Knob Gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Amber Brand Highlight -->
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Realistic Soft Drop Shadow Filter -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Pure White Studio Background (#FFFFFF) matching real catalog photography -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Product Vector Rendering -->
  
      <ellipse cx="200" cy="242" rx="125" ry="12" fill="#0F172A" opacity="0.12"/>
      <!-- Anodized Aluminum Cast Base -->
      <path d="M110,230 L290,230 L280,170 L210,150 L120,170 Z" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.5"/>
      
      <!-- Circular Slicer Blade Housing (Angled) -->
      <circle cx="170" cy="120" r="50" fill="url(#chrome)" stroke="#334155" stroke-width="2"/>
      <circle cx="170" cy="120" r="45" fill="url(#steelTop)" stroke="#94A3B8" stroke-width="1"/>
      <!-- Center Blade Cover Plate -->
      <circle cx="170" cy="120" r="22" fill="#334155" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="170" cy="120" r="5" fill="#D97706"/>

      <!-- Top Built-in Sharpener Stones -->
      <rect x="155" y="60" width="30" height="15" rx="3" fill="#64748B" stroke="#334155" stroke-width="1"/>
      <circle cx="163" cy="67" r="3" fill="#CBD5E1"/>
      <circle cx="177" cy="67" r="3" fill="#CBD5E1"/>

      <!-- Angled Product Carriage & Meat Pusher -->
      <polygon points="210,105 275,85 285,150 220,170" fill="url(#steelTop)" stroke="#475569" stroke-width="1.5"/>
      <path d="M250,85 L280,60" stroke="#0F172A" stroke-width="5" stroke-linecap="round"/>

      <!-- Thickness Regulator Dial Knob -->
      <circle cx="130" cy="205" r="12" fill="url(#knobGrad)" stroke="#334155" stroke-width="1.5"/>
      <!-- Rubber Anti-Slip Feet -->
      <rect x="120" y="230" width="15" height="8" rx="2" fill="#0F172A"/>
      <rect x="265" y="230" width="15" height="8" rx="2" fill="#0F172A"/>
    
</svg>