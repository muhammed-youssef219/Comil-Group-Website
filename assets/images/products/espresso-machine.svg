<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Professional Espresso System">
  <defs>
    <!-- Studio Photography Neutral Gradient Background -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Top Cap Stainless Gradient -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Chrome & Polished Steel Reflection -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Metal Chassis -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Precision Control Knob Gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Amber Brand Highlight -->
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Realistic Soft Drop Shadow Filter -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Pure White Studio Background (#FFFFFF) matching real catalog photography -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Product Vector Rendering -->
  
      <ellipse cx="200" cy="245" rx="125" ry="12" fill="#0F172A" opacity="0.12"/>
      <!-- Body Housing (Polished Mirror Steel & Deep Navy Accent) -->
      <rect x="105" y="65" width="190" height="165" rx="4" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Top Cup Warming Tray with Rail -->
      <rect x="110" y="55" width="180" height="14" rx="2" fill="url(#steelTop)" stroke="#64748B" stroke-width="1"/>
      <line x1="115" y1="52" x2="285" y2="52" stroke="url(#chrome)" stroke-width="2"/>

      <!-- Dual Chrome E61-Style Group Heads -->
      <g fill="url(#chrome)" stroke="#334155" stroke-width="1">
        <rect x="140" y="95" width="30" height="25" rx="3"/>
        <rect x="230" y="95" width="30" height="25" rx="3"/>
        <!-- Portafilters with Handles -->
        <rect x="135" y="120" width="40" height="12" rx="2"/>
        <path d="M155,132 L155,160 L145,175" stroke="#1E293B" stroke-width="6" stroke-linecap="round" fill="none"/>
        <rect x="225" y="120" width="40" height="12" rx="2"/>
        <path d="M245,132 L245,160 L235,175" stroke="#1E293B" stroke-width="6" stroke-linecap="round" fill="none"/>
      </g>

      <!-- Dual Pressure Gauges -->
      <circle cx="130" cy="85" r="9" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.5"/>
      <circle cx="270" cy="85" r="9" fill="#0F172A" stroke="#CBD5E1" stroke-width="1.5"/>
      <!-- Cool Touch Stainless Steam Wands -->
      <path d="M115,100 L110,165" stroke="url(#chrome)" stroke-width="3" stroke-linecap="round"/>
      <path d="M285,100 L290,165" stroke="url(#chrome)" stroke-width="3" stroke-linecap="round"/>

      <!-- Lower Drip Tray with Stainless Grating -->
      <rect x="110" y="200" width="180" height="25" rx="2" fill="url(#metalDark)" stroke="#475569" stroke-width="1"/>
      <line x1="115" y1="205" x2="285" y2="205" stroke="#94A3B8" stroke-width="2" stroke-dasharray="3,3"/>
      <!-- Chrome Feet -->
      <rect x="120" y="230" width="16" height="12" rx="2" fill="url(#chrome)"/>
      <rect x="264" y="230" width="16" height="12" rx="2" fill="url(#chrome)"/>
    
</svg>