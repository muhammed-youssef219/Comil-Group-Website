<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Heavy Pot &amp; Utensil Washer">
  <defs>
    <!-- Studio Photography Neutral Gradient Background -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Top Cap Stainless Gradient -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Chrome & Polished Steel Reflection -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Metal Chassis -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Precision Control Knob Gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Amber Brand Highlight -->
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Realistic Soft Drop Shadow Filter -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Pure White Studio Background (#FFFFFF) matching real catalog photography -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Product Vector Rendering -->
  
      <ellipse cx="200" cy="248" rx="135" ry="12" fill="#0F172A" opacity="0.12"/>
      <rect x="95" y="45" width="210" height="195" rx="5" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.5"/>
      
      <!-- Split Counter-Balanced Opening Doors -->
      <rect x="105" y="55" width="190" height="100" rx="3" fill="url(#steelTop)" stroke="#334155" stroke-width="1.5"/>
      <rect x="105" y="155" width="190" height="75" rx="2" fill="url(#steelGrad)" stroke="#334155" stroke-width="1.5"/>
      <!-- Massive Horizontal Grab Bar -->
      <rect x="120" y="148" width="160" height="8" rx="4" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>

      <!-- Pressure Gauge & Digital Control Panel -->
      <circle cx="200" cy="95" r="18" fill="#0F172A" stroke="#E2E8F0" stroke-width="2"/>
      <line x1="200" y1="95" x2="210" y2="88" stroke="#DC2626" stroke-width="2" stroke-linecap="round"/>
      <text x="200" y="105" fill="#94A3B8" font-size="6" text-anchor="middle" font-family="sans-serif">BAR</text>

      <!-- Industrial Legs -->
      <rect x="105" y="240" width="18" height="12" rx="2" fill="url(#steelTop)"/>
      <rect x="277" y="240" width="18" height="12" rx="2" fill="url(#steelTop)"/>
    
</svg>