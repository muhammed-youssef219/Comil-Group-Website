<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Reversible Pastry Dough Sheeter">
  <defs>
    <!-- Studio Photography Neutral Gradient Background -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Top Cap Stainless Gradient -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Chrome & Polished Steel Reflection -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Metal Chassis -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Precision Control Knob Gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Amber Brand Highlight -->
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Realistic Soft Drop Shadow Filter -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Pure White Studio Background (#FFFFFF) matching real catalog photography -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Product Vector Rendering -->
  
      <ellipse cx="200" cy="235" rx="145" ry="12" fill="#0F172A" opacity="0.12"/>
      <!-- Center Heavy Roller Cylinder Housing -->
      <rect x="165" y="80" width="70" height="135" rx="4" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.5"/>
      <!-- Chromium Calibration Cylinder Rollers -->
      <rect x="175" y="105" width="50" height="20" rx="3" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>
      <rect x="175" y="130" width="50" height="20" rx="3" fill="url(#chrome)" stroke="#334155" stroke-width="1"/>
      <!-- Thickness Adjustment Lever -->
      <path d="M200,80 L200,45 L225,40" stroke="#CBD5E1" stroke-width="4" stroke-linecap="round" fill="none"/>
      <circle cx="225" cy="40" r="5" fill="#D97706"/>

      <!-- Left Conveyor Table -->
      <polygon points="65,150 165,135 165,155 65,165" fill="#E2E8F0" stroke="#64748B" stroke-width="1.2"/>
      <!-- Left Support Leg -->
      <line x1="85" y1="162" x2="85" y2="225" stroke="#475569" stroke-width="3"/>

      <!-- Right Conveyor Table -->
      <polygon points="235,135 335,150 335,165 235,155" fill="#E2E8F0" stroke="#64748B" stroke-width="1.2"/>
      <!-- Right Support Leg -->
      <line x1="315" y1="162" x2="315" y2="225" stroke="#475569" stroke-width="3"/>
    
</svg>