<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-label="Under-Counter Prep Refrigerator">
  <defs>
    <!-- Studio Photography Neutral Gradient Background -->
    <radialGradient id="studioBg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </radialGradient>
    
    <!-- Brushed Stainless Steel Gradient -->
    <linearGradient id="steelGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="25%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>

    <!-- Top Cap Stainless Gradient -->
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Chrome & Polished Steel Reflection -->
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="35%" stop-color="#FFFFFF"/>
      <stop offset="65%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <!-- Dark Metal Chassis -->
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>

    <!-- Precision Control Knob Gradient -->
    <radialGradient id="knobGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </radialGradient>

    <!-- Amber Brand Highlight -->
    <linearGradient id="amberAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>

    <!-- Realistic Soft Drop Shadow Filter -->
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
  </defs>

  <!-- Pure White Studio Background (#FFFFFF) matching real catalog photography -->
  <rect width="400" height="300" fill="#FFFFFF"/>

  <!-- Product Vector Rendering -->
  
      <ellipse cx="200" cy="245" rx="145" ry="12" fill="#0F172A" opacity="0.12"/>
      <!-- Top Splashback Riser -->
      <rect x="65" y="70" width="270" height="18" rx="2" fill="url(#steelTop)" stroke="#475569" stroke-width="1.5"/>
      <!-- Worktop Surface -->
      <rect x="65" y="85" width="270" height="14" rx="2" fill="url(#chrome)" stroke="#64748B" stroke-width="1.5"/>
      <!-- Counter Body -->
      <rect x="70" y="99" width="260" height="135" rx="3" fill="url(#steelGrad)" stroke="#475569" stroke-width="1.5"/>

      <!-- 3 Undercounter Doors -->
      <rect x="76" y="105" width="78" height="120" rx="2" fill="url(#steelGrad)" stroke="#64748B" stroke-width="1.2"/>
      <rect x="160" y="105" width="78" height="120" rx="2" fill="url(#steelGrad)" stroke="#64748B" stroke-width="1.2"/>
      <rect x="244" y="105" width="78" height="120" rx="2" fill="url(#steelGrad)" stroke="#64748B" stroke-width="1.2"/>
      <!-- Recessed Door Handles -->
      <rect x="82" y="115" width="66" height="8" rx="2" fill="#1E293B"/>
      <rect x="166" y="115" width="66" height="8" rx="2" fill="#1E293B"/>
      <rect x="250" y="115" width="66" height="8" rx="2" fill="#1E293B"/>
      <!-- Digital Display on Front Lip -->
      <rect x="300" y="89" width="26" height="8" rx="1.5" fill="#0F172A"/>
      <text x="313" y="96" fill="#10B981" font-size="6" font-weight="700" text-anchor="middle" font-family="monospace">4°C</text>
      <!-- Adjustable Legs -->
      <rect x="80" y="234" width="14" height="14" rx="2" fill="url(#steelTop)"/>
      <rect x="193" y="234" width="14" height="14" rx="2" fill="url(#steelTop)"/>
      <rect x="306" y="234" width="14" height="14" rx="2" fill="url(#steelTop)"/>
    
</svg>